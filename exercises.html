<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>التدريبات المجانية - المكتبة</title>
  <meta name="description" content="تدريبات واختبارات مجانية تفاعلية لطلاب الابتدائي والإعدادي، مع تصحيح فوري وشرح لكل سؤال.">
  <meta name="theme-color" content="#128C7E" id="themeColorMeta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("theme") || "system";
        var dark = mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="exercises.css">
</head>
<body>

  <header class="ex-header">
    <div class="ex-header-inner">
      <a class="ex-back" href="index.html">
        <span aria-hidden="true">→</span>
        <span>المتجر</span>
      </a>

      <div class="ex-brand">
        <span class="ex-brand-icon" aria-hidden="true">🎯</span>
        <span>التدريبات</span>
      </div>

      <button class="ex-theme" id="themeBtn" type="button" onclick="toggleTheme()" title="تبديل المظهر" aria-label="تبديل المظهر الفاتح والغامق">
        <span id="themeIcon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="ex-main">

    <!-- ═══════ قائمة التدريبات ═══════ -->
    <section id="catalogView">
      <div class="ex-hero">
        <h1>تدريبات مجانية</h1>
        <p>اختبر نفسك في موادك الدراسية، وشوف الشرح بعد كل سؤال. بدون تسجيل وبدون مقابل.</p>
        <div class="ex-stats" id="exStats"></div>
      </div>

      <div class="ex-filters" id="gradeFilters" role="group" aria-label="فلترة حسب الصف الدراسي"></div>

      <div class="ex-grid" id="quizList" aria-live="polite"></div>
    </section>

    <!-- ═══════ حل التدريب ═══════ -->
    <section id="quizView" hidden>
      <div class="quiz-top">
        <button class="quiz-exit" type="button" onclick="exitQuiz()">✕ إنهاء</button>
        <div class="quiz-progress-info">
          <span id="qCounter">سؤال 1 من 5</span>
          <span id="qScore">0 إجابة صحيحة</span>
        </div>
      </div>

      <div class="quiz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="تقدم التدريب">
        <span id="qBar"></span>
      </div>

      <div class="quiz-card">
        <div class="quiz-question" id="qText"></div>
        <div class="quiz-options" id="qOptions" role="group" aria-label="اختر الإجابة الصحيحة"></div>
        <div class="quiz-feedback" id="qFeedback" role="status" aria-live="polite"></div>
        <div class="quiz-actions">
          <button class="btn-next" id="qNext" type="button" onclick="nextQuestion()" hidden>السؤال التالي ←</button>
        </div>
      </div>
    </section>

    <!-- ═══════ النتيجة ═══════ -->
    <section id="resultView" hidden>
      <div class="result-card">
        <div class="result-ring" id="resultRing"><span id="resultPercent">0%</span></div>
        <h2 id="resultTitle">أحسنت!</h2>
        <p class="result-sub" id="resultSub"></p>

        <div class="result-stats" id="resultStats"></div>

        <div class="result-review" id="resultReview"></div>

        <div class="result-actions">
          <button class="btn-primary" type="button" onclick="retryQuiz()">🔄 إعادة المحاولة</button>
          <button class="btn-secondary" type="button" onclick="backToCatalog()">📚 تدريب آخر</button>
          <a class="btn-secondary" href="index.html">🛒 المتجر</a>
        </div>
      </div>
    </section>

  </main>

  <footer class="ex-footer">
    <p>المكتبة — تدريبات مجانية لطلابنا 🌟</p>
  </footer>

  <div class="ex-toast" id="exToast" role="status" aria-live="polite"></div>

  <script src="exercises.js"></script>
</body>
</html>
