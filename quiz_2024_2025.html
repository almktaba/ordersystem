<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الرياضيات — 2024 / 2025</title>
<style>
  :root{ --ink:#16243a; --muted:#64748b; --line:#dbe3ef; --brand:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f4f7fb; color:var(--ink); font-family:"Segoe UI","Tahoma","Arial",sans-serif; line-height:1.8; }
  .wrap{ max-width:900px; margin:auto; padding:24px 16px 60px; }
  header{ background:linear-gradient(135deg,#1d4ed8,#0f766e); color:#fff; border-radius:18px; padding:22px 24px; box-shadow:0 8px 24px rgba(15,118,110,.18); }
  header h1{ margin:0 0 6px; font-size:26px; }
  header p{ margin:0; opacity:.92; font-size:15px; }
  .bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0; }
  button.act{ border:0; border-radius:12px; padding:11px 20px; font-size:16px; font-weight:700; cursor:pointer; color:#fff; background:var(--brand); box-shadow:0 4px 12px rgba(37,99,235,.22); }
  button.act.ghost{ background:#e2e8f0; color:#334155; box-shadow:none; }
  button.act:hover{ filter:brightness(.96); }
  #result{ margin:0 0 18px; padding:0; }
  #result:not(:empty){ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 18px; box-shadow:0 3px 10px rgba(15,23,42,.04); }
  #result strong{ font-size:19px; color:var(--brand); }
  .note{ color:var(--muted); margin:8px 0 0; font-size:14px; }
  .mylist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; margin-top:10px; font-size:14px; }
  .qcard{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 3px 12px rgba(15,23,42,.04); }
  .qhead{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed var(--line); padding-bottom:8px; margin-bottom:12px; }
  .qnum{ font-weight:800; color:var(--brand); }
  .qpoints{ color:var(--muted); font-size:13px; }
  .qbody{ text-align:center; margin:6px 0 14px; }
  .qimg{ max-width:100%; height:auto; border-radius:10px; }
  .qtext{ white-space:pre-wrap; text-align:right; font-size:18px; font-weight:600; }
  .opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .opt{ display:flex; align-items:center; gap:10px; min-height:62px; padding:8px 10px; border:2px solid var(--line); border-radius:12px; background:#fbfdff; cursor:pointer; text-align:right; transition:.15s; font:inherit; color:inherit; }
  .opt:hover{ border-color:#93c5fd; background:#f1f7ff; }
  .opt.sel{ border-color:var(--brand); background:#eaf1ff; }
  .opt.right{ border-color:var(--ok); background:#ecfdf3; }
  .opt.wrong{ border-color:var(--bad); background:#fef2f2; }
  .badge{ flex:0 0 30px; height:30px; border-radius:50%; background:#e2e8f0; color:#334155; display:grid; place-items:center; font-weight:800; font-size:14px; }
  .opt.sel .badge{ background:var(--brand); color:#fff; }
  .opt.right .badge{ background:var(--ok); color:#fff; }
  .opt.wrong .badge{ background:var(--bad); color:#fff; }
  .ocontent{ display:flex; align-items:center; justify-content:center; flex:1; min-width:0; }
  .oimg{ max-width:100%; max-height:64px; height:auto; }
  .otext{ font-size:16px; }
  .feedback{ min-height:22px; margin-top:10px; font-size:14px; font-weight:700; }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--bad); }
  .feedback.warn{ color:var(--warn); }
  @media (max-width:600px){ header h1{font-size:21px} .opts{grid-template-columns:1fr} }
</style>
</head>

var withAnswers = false;
var selected = {};

function el(id){ return document.getElementById(id); }

function render(){
  var host = el('questions');
  var out = '';
  for(var i=0;i<data.questions.length;i++){
    var q = data.questions[i];
    out += '<section class="qcard" id="q'+i+'">';
    out += '<div class="qhead"><span class="qnum">السؤال '+q.q+'</span><span class="qpoints">نقطتان (2)</span></div>';
    out += '<div class="qbody">'+q.qhtml+'</div>';
    out += '<div class="opts">';
    for(var j=0;j<q.options.length;j++){
      var o = q.options[j];
      out += '<button type="button" class="opt" id="o'+i+'_'+j+'" onclick="choose('+i+','+j+')">';
      out += '<span class="badge">'+o.label+'</span>';
      out += '<span class="ocontent">'+o.html+'</span>';
      out += '</button>';
    }
    out += '</div><div class="feedback" id="fb'+i+'"></div></section>';
  }
  host.innerHTML = out;
}

function choose(i,j){
  selected[i] = j;
  var n = data.questions[i].options.length;
  for(var k=0;k<n;k++){ el('o'+i+'_'+k).classList.toggle('sel', k===j); }
}

function check(){
  if(!withAnswers){ showChoices(); return; }
  var score = 0, answered = 0;
  for(var i=0;i<data.questions.length;i++){
    var q = data.questions[i];
    var fb = el('fb'+i);
    var chosen = selected[i];
    for(var k=0;k<q.options.length;k++){ el('o'+i+'_'+k).classList.remove('right','wrong'); }
    if(chosen === undefined){
      fb.className = 'feedback warn';
      fb.textContent = 'لم تختر إجابة.';
      continue;
    }
    answered++;
    var right = q.answerIndex;
    el('o'+i+'_'+chosen).classList.add(chosen === right ? 'right' : 'wrong');
    if(chosen === right){
      score++;
      fb.className = 'feedback ok';
      fb.textContent = '✔ إجابة صحيحة';
    } else {
      if(right !== null && right >= 0) el('o'+i+'_'+right).classList.add('right');
      fb.className = 'feedback bad';
      fb.textContent = '✘ الإجابة الصحيحة: ' + (right !== null && right >= 0 ? q.options[right].label : 'غير متوفرة');
    }
  }
  el('result').innerHTML = '<strong>النتيجة: '+score+' من '+data.questions.length+'</strong><span class="note"> — عدد الإجابات: '+answered+'</span>';
}

function showChoices(){
  var out = '<strong>تم تسجيل اختياراتك.</strong><div class="mylist">';
  for(var i=0;i<data.questions.length;i++){
    var c = selected[i];
    out += '<div>س '+data.questions[i].q+': '+(c===undefined ? 'لم تختر' : data.questions[i].options[c].label)+'</div>';
  }
  out += '</div><p class="note">لم يتوفر مفتاح الإجابة لهذا النموذج، لذلك لا توجد درجة أو تصحيح آلي.</p>';
  el('result').innerHTML = out;
}

function reset(){
  selected = {};
  for(var i=0;i<data.questions.length;i++){
    for(var j=0;j<data.questions[i].options.length;j++){ el('o'+i+'_'+j).className = 'opt'; }
    el('fb'+i).className = 'feedback';
    el('fb'+i).textContent = '';
  }
  el('result').innerHTML = '';
}

render();
</script>
